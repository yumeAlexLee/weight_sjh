<style>
  #food-section h2 { font-size: 16px; font-weight: 700; color: #f1f5f9; margin-bottom: 12px; }
  #food-unavail-banner {
    display: none;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 16px;
  }
  #food-unavail-banner a { color: #3b82f6; }
  .food-card { display: none; }
  .food-progress-wrap {
    background: #0f172a;
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
    margin: 6px 0 12px;
  }
  .food-progress-bar {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #22c55e);
    border-radius: 6px;
    transition: width 0.4s;
  }
  .food-progress-bar.over { background: #ef4444; }
  .food-progress-bar.protein-bar { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
  .food-stat-row { display: flex; align-items: baseline; gap: 6px; font-size: 13px; color: #94a3b8; }
  .food-stat-row strong { font-size: 20px; color: #f1f5f9; }
  .food-stat-row .remain { margin-left: auto; font-size: 12px; }
  .food-stat-row .remain.over { color: #f87171; }
  #food-rule-comment { font-size: 13px; color: #94a3b8; margin-top: 4px; }
  #food-ai-verdict { font-size: 20px; font-weight: 700; color: #f1f5f9; margin-bottom: 6px; }
  #food-ai-advice { font-size: 14px; color: #cbd5e1; margin-bottom: 12px; }
  .food-ai-meta { display: flex; justify-content: space-between; align-items: center; }
  .food-ai-meta span { font-size: 11px; color: #64748b; }
  .food-ai-meta button { font-size: 12px; color: #3b82f6; background: none; border: none; cursor: pointer; padding: 4px 8px; }
  #food-bulk {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 12px 14px;
    color: #e2e8f0;
    font-size: 14px;
    resize: vertical;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s;
    box-sizing: border-box;
  }
  #food-bulk:focus { border-color: #3b82f6; }
  #food-bulk::placeholder { color: #475569; }
  .food-btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .food-btn-row .btn { flex: 1; padding: 12px; font-size: 14px; }
  #food-preview-wrap { margin-top: 12px; }
  #food-preview-wrap table { font-size: 12px; }
  #food-preview-wrap input[type="number"] {
    width: 64px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 4px 6px;
    color: #e2e8f0;
    font-size: 12px;
    outline: none;
  }
  #food-preview-wrap input[type="number"]:focus { border-color: #3b82f6; }
  .unknown-row td { color: #f87171; }
  .unknown-row input[type="number"] { border-color: #ef4444; }
  .food-preview-total { font-size: 13px; color: #94a3b8; margin: 10px 0 8px; text-align: right; }
  .food-badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .food-badge.ai { background: #3b1e7420; color: #a78bfa; border: 1px solid #7c3aed40; }
  .food-badge.rule { background: #0369a120; color: #38bdf8; border: 1px solid #0369a140; }
  .food-badge.manual { background: #92400e20; color: #fbbf24; border: 1px solid #b4590940; }
  .food-del-btn {
    background: none;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 15px;
    padding: 2px 6px;
    opacity: 0.7;
  }
  .food-del-btn:hover { opacity: 1; }
  #food-week-table th, #food-week-table td { font-size: 12px; padding: 8px 10px; }
  #food-week-table .over-kcal { color: #f87171; }
  #food-items-table th, #food-items-table td { font-size: 13px; }
  .food-single-form { padding: 10px 0 2px; display: flex; flex-direction: column; gap: 8px; }
  .food-single-row { display: flex; gap: 8px; }
  .food-single-row select, .food-single-row input[type="text"] {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 12px;
    color: #e2e8f0;
    font-size: 14px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .food-single-row select { flex: 0 0 72px; }
  .food-single-row input[type="text"] { flex: 1; }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
</style>

<section id="food-section">
  <h2>🍽 饮食记录</h2>

  <div id="food-unavail-banner">
    记录功能请在 <a href="https://weight-sjh.vercel.app" target="_blank">weight-sjh.vercel.app</a> 打开
  </div>

  <!-- 1. 今日概览卡 -->
  <div class="card food-card" id="food-overview-card">
    <div class="card-title">今日概览</div>
    <div class="food-stat-row">
      <span>热量</span>
      <strong id="food-kcal-val">0</strong>
      <span>/ <span id="food-kcal-target">1700</span> kcal</span>
      <span class="remain" id="food-kcal-remain">剩余 1700 kcal</span>
    </div>
    <div class="food-progress-wrap">
      <span class="food-progress-bar" id="food-bar-kcal" style="width:0%"></span>
    </div>
    <div class="food-stat-row">
      <span>蛋白</span>
      <strong id="food-protein-val">0.0</strong>
      <span>/ <span id="food-protein-target">100</span> g</span>
    </div>
    <div class="food-progress-wrap">
      <span class="food-progress-bar protein-bar" id="food-bar-protein" style="width:0%"></span>
    </div>
    <div id="food-rule-comment"></div>
  </div>

  <!-- 2. AI 分析卡 -->
  <div class="card food-card" id="food-ai-card">
    <div class="card-title">🤖 AI 分析</div>
    <div id="food-ai-content">
      <button class="btn" id="food-ai-gen-btn" onclick="foodGenerateAI(false)" style="font-size:14px;padding:12px;">生成今天的分析</button>
    </div>
  </div>

  <!-- 3. 记录输入 -->
  <div class="card food-card" id="food-input-card">
    <div class="card-title">记录输入</div>
    <textarea id="food-bulk" rows="6" placeholder="📅11/8:空腹54.5 🩸&#10;椰子水350ml、薯条中份、炸鸡汉堡半个&#10;水200ml、可乐500ml"></textarea>
    <div class="food-btn-row">
      <button class="btn" id="food-parse-btn" onclick="foodParse()" style="padding:12px;font-size:14px;">解析</button>
    </div>
    <div id="food-preview-wrap" style="display:none;">
      <table id="food-preview-table" style="width:100%;border-collapse:collapse;">
        <thead>
          <tr>
            <th>日期</th><th>内容</th><th>kcal</th><th>蛋白(g)</th><th>来源</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="food-preview-total" id="food-preview-total">本段合计 0 kcal / 蛋白 0.0 g</div>
      <button class="btn" id="food-save-btn" onclick="foodSave()" style="padding:12px;font-size:14px;">保存 0 项</button>
    </div>

    <details style="margin-top:14px;">
      <summary style="font-size:13px;color:#3b82f6;padding:4px 0;">+ 单项</summary>
      <div class="food-single-form">
        <div class="food-single-row">
          <select id="food-single-meal">
            <option value="朝">朝</option>
            <option value="昼">昼</option>
            <option value="夜" selected>夜</option>
            <option value="間食">間食</option>
          </select>
          <input type="text" id="food-single-text" placeholder="例: 鶏むね150g">
        </div>
        <button class="btn" id="food-single-btn" onclick="foodSingleSubmit()" style="padding:12px;font-size:14px;">记录</button>
      </div>
    </details>
  </div>

  <!-- 4. 近 7 天 -->
  <div class="card food-card" id="food-week-card">
    <div class="card-title">近 7 天</div>
    <div style="overflow-x:auto;">
      <table id="food-week-table" style="width:100%;border-collapse:collapse;">
        <thead>
          <tr><th>日期</th><th>kcal</th><th>蛋白(g)</th><th>体重</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- 5. 今天已记录明细 -->
  <div class="card food-card" id="food-items-card">
    <div class="card-title">今日明细</div>
    <div style="overflow-x:auto;">
      <table id="food-items-table" style="width:100%;border-collapse:collapse;">
        <thead>
          <tr><th>时段</th><th>内容</th><th>kcal</th><th>蛋白(g)</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function() {
  var FOOD_TARGET = { kcal: 1700, protein: 100 };
  var _previewData = [];
  var _foodToday = null;

  function foodTodayJST() {
    return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
  }

  function sourceBadge(source) {
    var map = { ai: 'AI', rule: '内藏库', manual: '手动' };
    var cls = { ai: 'ai', rule: 'rule', manual: 'manual' };
    var label = map[source] || source || '?';
    var c = cls[source] || 'rule';
    return '<span class="food-badge ' + c + '">' + label + '</span>';
  }

  function renderOverview(today, comment) {
    var kcal = today ? Math.round(today.kcal) : 0;
    var protein = today ? parseFloat(today.protein || 0) : 0;
    document.getElementById('food-kcal-val').textContent = kcal;
    document.getElementById('food-protein-val').textContent = protein.toFixed(1);
    var kcalPct = Math.min(100, Math.round(kcal / FOOD_TARGET.kcal * 100));
    var bar = document.getElementById('food-bar-kcal');
    bar.style.width = kcalPct + '%';
    if (kcal > FOOD_TARGET.kcal) {
      bar.className = 'food-progress-bar over';
    } else {
      bar.className = 'food-progress-bar';
    }
    var remain = document.getElementById('food-kcal-remain');
    if (kcal > FOOD_TARGET.kcal) {
      remain.textContent = '超出 ' + (kcal - FOOD_TARGET.kcal) + ' kcal';
      remain.className = 'remain over';
    } else {
      remain.textContent = '剩余 ' + (FOOD_TARGET.kcal - kcal) + ' kcal';
      remain.className = 'remain';
    }
    var protPct = Math.min(100, Math.round(protein / FOOD_TARGET.protein * 100));
    document.getElementById('food-bar-protein').style.width = protPct + '%';
    document.getElementById('food-rule-comment').textContent = comment || '';
  }

  function renderAICard(analysis) {
    var el = document.getElementById('food-ai-content');
    if (!analysis) {
      el.innerHTML = '<button class="btn" id="food-ai-gen-btn" onclick="foodGenerateAI(false)" style="font-size:14px;padding:12px;">生成今天的分析</button>';
      return;
    }
    var isRule = analysis.model === 'rule';
    var timeStr = '';
    if (analysis.updated_at) {
      var t = analysis.updated_at.slice(5, 16).replace('T', ' ');
      timeStr = t;
    }
    var metaLabel = isRule ? '规则版（未接 AI）' : 'AI · ' + timeStr + ' 生成';
    el.innerHTML =
      '<div id="food-ai-verdict">' + esc(analysis.verdict) + '</div>' +
      '<div id="food-ai-advice">' + esc(analysis.advice) + '</div>' +
      '<div class="food-ai-meta">' +
        '<span>' + metaLabel + '</span>' +
        '<button onclick="foodGenerateAI(true)">重新分析</button>' +
      '</div>';
  }

  function renderWeekTable(days) {
    var tbody = document.querySelector('#food-week-table tbody');
    tbody.innerHTML = '';
    for (var i = 0; i < days.length; i++) {
      var d = days[i];
      var weight = null;
      if (typeof chartData !== 'undefined' && chartData.rawDates) {
        var idx = chartData.rawDates.indexOf(d.date);
        if (idx >= 0) weight = chartData.weights[idx];
      }
      var isOver = d.kcal > FOOD_TARGET.kcal;
      var tr = document.createElement('tr');
      if (isOver) tr.className = 'over-kcal';
      tr.innerHTML =
        '<td>' + d.date.slice(5) + '</td>' +
        '<td>' + (d.kcal || 0) + '</td>' +
        '<td>' + parseFloat(d.protein || 0).toFixed(1) + '</td>' +
        '<td>' + (weight !== null ? weight + 'kg' : '-') + '</td>';
      tbody.appendChild(tr);
    }
  }

  function renderItemsTable(items) {
    var tbody = document.querySelector('#food-items-table tbody');
    tbody.innerHTML = '';
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var tr = document.createElement('tr');
      var delBtn = document.createElement('button');
      delBtn.className = 'food-del-btn';
      delBtn.textContent = '🗑';
      delBtn.dataset.date = item.date;
      delBtn.dataset.meal = item.meal;
      delBtn.dataset.text = item.text;
      delBtn.addEventListener('click', handleItemDelete);
      var td1 = document.createElement('td'); td1.textContent = item.meal;
      var td2 = document.createElement('td'); td2.textContent = item.text;
      var td3 = document.createElement('td'); td3.textContent = Math.round(item.kcal);
      var td4 = document.createElement('td'); td4.textContent = parseFloat(item.protein || 0).toFixed(1);
      var td5 = document.createElement('td'); td5.appendChild(delBtn);
      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
      tr.appendChild(td4); tr.appendChild(td5);
      tbody.appendChild(tr);
    }
  }

  function renderPreviewTable(preview) {
    _previewData = preview.slice();
    var tbody = document.querySelector('#food-preview-table tbody');
    tbody.innerHTML = '';
    for (var i = 0; i < _previewData.length; i++) {
      (function(idx) {
        var p = _previewData[idx];
        var tr = document.createElement('tr');
        if (p.unknown) tr.className = 'unknown-row';

        var td1 = document.createElement('td'); td1.textContent = p.date.slice(5);
        var td2 = document.createElement('td'); td2.textContent = p.text;
        var td2b = document.createElement('td');

        var inp = document.createElement('input');
        inp.type = 'number';
        inp.min = '0';
        inp.step = '1';
        inp.value = p.unknown ? '' : p.kcal;
        inp.placeholder = p.unknown ? '?' : '';
        inp.addEventListener('change', function() {
          var v = parseFloat(inp.value);
          _previewData[idx].kcal = isNaN(v) ? 0 : Math.round(v);
          _previewData[idx].source = 'manual';
          _previewData[idx].unknown = false;
          tr.className = '';
          badgeCell.innerHTML = sourceBadge('manual');
          updatePreviewTotals();
        });
        td2b.appendChild(inp);

        var td3 = document.createElement('td'); td3.textContent = p.unknown ? '-' : parseFloat(p.protein || 0).toFixed(1);
        var badgeCell = document.createElement('td');
        badgeCell.innerHTML = sourceBadge(p.source);
        var tdX = document.createElement('td');
        var xBtn = document.createElement('button');
        xBtn.className = 'food-del-btn';
        xBtn.textContent = '✕';
        xBtn.addEventListener('click', function() {
          _previewData[idx]._deleted = true;
          tr.remove();
          updatePreviewTotals();
        });
        tdX.appendChild(xBtn);

        tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td2b);
        tr.appendChild(td3); tr.appendChild(badgeCell); tr.appendChild(tdX);
        tbody.appendChild(tr);
      })(i);
    }
    updatePreviewTotals();
    document.getElementById('food-preview-wrap').style.display = '';
  }

  function updatePreviewTotals() {
    var kcal = 0, protein = 0, saveCount = 0;
    for (var i = 0; i < _previewData.length; i++) {
      var p = _previewData[i];
      if (p._deleted) continue;
      if (!p.unknown || p.kcal > 0) {
        kcal += p.kcal || 0;
        protein += p.protein || 0;
        saveCount++;
      }
    }
    document.getElementById('food-preview-total').textContent =
      '本段合计 ' + Math.round(kcal) + ' kcal / 蛋白 ' + protein.toFixed(1) + ' g';
    document.getElementById('food-save-btn').textContent = '保存 ' + saveCount + ' 项';
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function loadFoodData() {
    var today = foodTodayJST();
    try {
      var r = await fetch('/api/food-log?date=' + today);
      if (r.ok) {
        var data = await r.json();
        if (data.success) {
          _foodToday = data.today;
          renderOverview(data.today, data.comment);
          renderItemsTable(data.items || []);
        }
      }
    } catch {}
    try {
      var r2 = await fetch('/api/food-analysis?date=' + today);
      if (r2.ok) {
        var d2 = await r2.json();
        if (d2.success) renderAICard(d2.analysis);
      }
    } catch {}
    try {
      var r3 = await fetch('/api/food-log?days=7');
      if (r3.ok) {
        var d3 = await r3.json();
        if (d3.success) renderWeekTable(d3.days);
      }
    } catch {}
  }

  window.foodParse = async function() {
    var raw = document.getElementById('food-bulk').value.trim();
    if (!raw) return;
    var entries = parseBulkText(raw);
    if (!entries.length) {
      document.getElementById('food-rule-comment').textContent = '没有找到日期块（需要像 📅11/8: 这样的行）';
      return;
    }
    var btn = document.getElementById('food-parse-btn');
    btn.disabled = true; btn.textContent = '解析中…';
    try {
      var r = await fetch('/api/food-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entries: entries, dryRun: true, ai: true }),
      });
      if (!r.ok) {
        var err = await r.json().catch(function() { return {}; });
        throw new Error(err.error || '解析失败');
      }
      var data = await r.json();
      if (!data.success) throw new Error(data.error || '解析失败');
      renderPreviewTable(data.preview || []);
    } catch (e) {
      document.getElementById('food-rule-comment').textContent = '解析失败：' + e.message;
    } finally {
      btn.disabled = false; btn.textContent = '解析';
    }
  };

  window.foodSave = async function() {
    if (!_previewData.length) return;
    var toSave = _previewData.filter(function(p) { return !p._deleted && (!p.unknown || p.kcal > 0); });
    if (!toSave.length) return;
    var btn = document.getElementById('food-save-btn');
    btn.disabled = true; btn.textContent = '保存中…';
    try {
      var r = await fetch('/api/food-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entries: toSave, dryRun: false }),
      });
      if (!r.ok) {
        var err = await r.json().catch(function() { return {}; });
        throw new Error(err.error || '保存失败');
      }
      var data = await r.json();
      if (!data.success) throw new Error(data.error || '保存失败');
      document.getElementById('food-bulk').value = '';
      document.getElementById('food-preview-wrap').style.display = 'none';
      _previewData = [];
      await loadFoodData();
      var totalUnknown = 0;
      if (data.totals) {
        Object.values(data.totals).forEach(function(t) { totalUnknown += (t.unknownCount || 0); });
      }
      var saveMsg;
      if (totalUnknown > 0) {
        saveMsg = '已保存 ' + data.count + ' 项（⚠️ ' + totalUnknown + ' 项未识别，未计入总量）';
        if (data.skipped > 0) saveMsg += '，已存在 ' + data.skipped + ' 项，跳过';
      } else if (data.skipped > 0) {
        saveMsg = '已保存 ' + data.count + ' 项，已存在 ' + data.skipped + ' 项，跳过';
      } else {
        saveMsg = '已保存 ' + data.count + ' 项';
      }
      document.getElementById('food-rule-comment').textContent = saveMsg;
      // Try to generate AI analysis
      var today = foodTodayJST();
      fetch('/api/food-analysis', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: today, force: false }),
      }).then(function(r2) {
        if (r2.ok) return r2.json();
      }).then(function(d) {
        if (d && d.success) renderAICard(d.analysis);
      }).catch(function() {});
    } catch (e) {
      document.getElementById('food-rule-comment').textContent = '保存失败：' + e.message;
    } finally {
      btn.disabled = false; btn.textContent = '保存';
    }
  };

  window.foodGenerateAI = async function(force) {
    var today = foodTodayJST();
    var el = document.getElementById('food-ai-content');
    var origHtml = el.innerHTML;
    el.innerHTML = '<span style="color:#64748b;font-size:14px;">分析中…</span>';
    try {
      var r = await fetch('/api/food-analysis', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: today, force: !!force }),
      });
      if (!r.ok) throw new Error('API error');
      var data = await r.json();
      if (data.success) {
        renderAICard(data.analysis);
      } else {
        el.innerHTML = origHtml;
      }
    } catch {
      el.innerHTML = origHtml;
    }
  };

  window.foodSingleSubmit = async function() {
    var meal = document.getElementById('food-single-meal').value;
    var text = document.getElementById('food-single-text').value.trim();
    if (!text) return;
    var btn = document.getElementById('food-single-btn');
    btn.disabled = true; btn.textContent = '记录中…';
    var today = foodTodayJST();
    try {
      var r = await fetch('/api/food-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: today, meal: meal, text: text }),
      });
      if (!r.ok) {
        var err = await r.json().catch(function() { return {}; });
        throw new Error(err.error || '记录失败');
      }
      var data = await r.json();
      if (!data.success) throw new Error(data.error || '记录失败');
      document.getElementById('food-single-text').value = '';
      await loadFoodData();
    } catch (e) {
      document.getElementById('food-rule-comment').textContent = '记录失败：' + e.message;
    } finally {
      btn.disabled = false; btn.textContent = '记录';
    }
  };

  function handleItemDelete(e) {
    var btn = e.currentTarget;
    var date = btn.dataset.date;
    var meal = btn.dataset.meal;
    var text = btn.dataset.text;
    if (!confirm('删除「' + text + '」这一项？')) return;
    btn.disabled = true;
    fetch('/api/food-log', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: date, meal: meal, text: text }),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) loadFoodData();
    })
    .catch(function() { btn.disabled = false; });
  }

  function parseBulkText(raw) {
    var year = new Date().getFullYear();
    var currentMonth = new Date().getMonth() + 1;
    var entries = [];
    var currentDate = null;
    var lines = raw.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line || line.charAt(0) === '#') continue;
      if (/📅/.test(line) || /空腹/.test(line)) {
        var dm = line.match(/(\d{1,2})\/(\d{1,2})/);
        if (dm) {
          var m = parseInt(dm[1], 10);
          var d = parseInt(dm[2], 10);
          var y = year;
          if (m > currentMonth) y = year - 1;
          currentDate = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        }
        continue;
      }
      if (!currentDate) continue;
      var parts = line.split(/[、，,；;]+/);
      for (var j = 0; j < parts.length; j++) {
        var p = parts[j].trim();
        if (p) entries.push({ date: currentDate, meal: '一括', text: p });
      }
    }
    return entries;
  }

  document.addEventListener('DOMContentLoaded', async function() {
    var ok = false;
    try {
      var controller = new AbortController();
      var timer = setTimeout(function() { controller.abort(); }, 3000);
      var r = await fetch('/api/health', { signal: controller.signal });
      clearTimeout(timer);
      ok = r.ok;
    } catch {}

    if (!ok) {
      document.getElementById('food-unavail-banner').style.display = '';
      return;
    }

    document.querySelectorAll('.food-card').forEach(function(c) { c.style.display = ''; });
    await loadFoodData();
  });
})();
</script>
